

  <!-- MODAL LIGHTBOX DIDÁCTICO PARA AMPLIAR FOTOS -->
  <div 
    id="photo-lightbox-modal" 
    class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex-col items-center justify-center p-4 transition-opacity"
    role="dialog"
    aria-modal="true"
    aria-label="Visor ampliado de fotografía de recuerdo"
  >
    <button 
      id="lightbox-close-btn" 
      class="absolute top-4 right-4 text-white hover:text-teal-300 text-2xl w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition"
      aria-label="Cerrar visor de fotografía"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="max-w-3xl max-h-[80vh] flex flex-col items-center">
      <img 
        id="lightbox-target-img" 
        src="" 
        alt="Fotografía de boda ampliada" 
        class="max-w-full max-h-[72vh] object-contain rounded-xl shadow-2xl border border-white/20"
      >
      <p id="lightbox-caption" class="text-white text-xs sm:text-sm mt-2 text-center font-serif italic"></p>
    </div>
  </div>

  <!-- Notificación Toast Accesible -->
  <div id="toast-msg" role="status" aria-live="assertive">Acción realizada correctamente</div>
