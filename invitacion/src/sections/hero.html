<section id="hero" class="snap-section bg-tropical-grad text-center" aria-label="Portada de Boda">
      
      <!-- Decoración botánica floral en SVG -->
      <svg class="absolute -top-10 -left-10 w-52 h-52 text-teal-300 opacity-20 pointer-events-none" fill="currentColor" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M10,20 Q60,10 70,50 Q80,90 30,90 Q5,70 10,20 Z" />
      </svg>
      <svg class="absolute -bottom-10 -right-10 w-60 h-60 text-teal-400 opacity-15 pointer-events-none" fill="currentColor" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M20,10 Q90,30 80,70 Q70,95 20,80 Q5,50 20,10 Z" />
      </svg>

      <div class="max-w-4xl w-full mx-auto px-4 z-10 flex flex-col items-center justify-center h-full">
        
        <!-- Insignia Tropical -->
        <header class="mb-2">
          <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-white/85 border border-teal-200 shadow-xs text-teal-900 text-[11px] sm:text-xs tracking-widest uppercase font-semibold">
            <i class="fa-solid fa-leaf text-teal-600" aria-hidden="true"></i>
            <span>Nuestra Boda</span>
            <i class="fa-solid fa-leaf text-teal-600" aria-hidden="true"></i>
          </div>
        </header>

        <!-- Nombres Oficiales de los Novios -->
        <h1 class="text-2xl sm:text-5xl md:text-6xl font-serif text-stone-900 leading-tight">
          <span class="block">Kleibert Medina.</span>
          <span class="font-cursive text-teal-600 text-2xl sm:text-6xl block my-1">&amp;</span>
          <span class="block">Sandy Mansilla.</span>
        </h1>

        <p class="font-serif italic text-stone-600 text-sm sm:text-lg max-w-xl mx-auto my-2 font-light">
          "Las muchas aguas no podrán apagar el amor, ni lo ahogarán los ríos." — Cantares 8:7
        </p>

        <!-- Retrato de los Novios -->
        <figure class="relative my-2 animate-float">
          <div class="w-[350px] h-[350px] lg:w-[350px] lg:h-[350px] rounded-xl overflow-hidden border-4 border-white shadow-xl mx-auto bg-stone-100">
            <img 
              src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=600&q=80" 
              alt="Fotografía de compromiso de Kleibert José Medina Gómez y Sandy Dannae Mansilla Rivera" 
              class="w-full h-full object-cover object-center"
              loading="eager"
            >
          </div>
        </figure>

        <!-- Reloj / Contador Regresivo -->
        <div class="w-full max-w-md mt-2" aria-live="polite">
          <p class="text-[10px] uppercase tracking-widest text-stone-500 font-semibold mb-2">
            Tiempo estimado para la celebración
          </p>
          <div class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-white/90 backdrop-blur-sm p-2 rounded-xl border border-teal-100 shadow-xs">
              <span id="timer-days" class="block text-xl sm:text-2xl font-serif font-bold text-teal-800">00</span>
              <span class="text-[10px] text-stone-500 uppercase">Días</span>
            </div>
            <div class="bg-white/90 backdrop-blur-sm p-2 rounded-xl border border-teal-100 shadow-xs">
              <span id="timer-hours" class="block text-xl sm:text-2xl font-serif font-bold text-teal-800">00</span>
              <span class="text-[10px] text-stone-500 uppercase">Horas</span>
            </div>
            <div class="bg-white/90 backdrop-blur-sm p-2 rounded-xl border border-teal-100 shadow-xs">
              <span id="timer-minutes" class="block text-xl sm:text-2xl font-serif font-bold text-teal-800">00</span>
              <span class="text-[10px] text-stone-500 uppercase">Min</span>
            </div>
            <div class="bg-white/90 backdrop-blur-sm p-2 rounded-xl border border-teal-100 shadow-xs">
              <span id="timer-seconds" class="block text-xl sm:text-2xl font-serif font-bold text-teal-800">00</span>
              <span class="text-[10px] text-stone-500 uppercase">Seg</span>
            </div>
          </div>
        </div>

        <!-- Indicador de Navegación -->
        <a href="#ceremonias" class="mt-3 text-stone-400 hover:text-teal-700 transition animate-bounce" aria-label="Ir a la sección de Ceremonias">
          <i class="fa-solid fa-chevron-down text-lg" aria-hidden="true"></i>
        </a>

      </div>
    </section>
